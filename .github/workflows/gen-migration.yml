name: Generate baseline migration (temporary)
on:
  push:
    branches: [chore/prisma-migrations-baseline]
    paths: [.github/workflows/gen-migration.yml]
jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Generate SQL from schema
        working-directory: apps/api
        run: |
          mkdir -p prisma/migrations/0_init
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > prisma/migrations/0_init/migration.sql
          printf '# Please do not edit this file manually\n# It should be added in your version-control system (e.g., Git)\nprovider = "postgresql"\n' > prisma/migrations/migration_lock.toml
      - name: Emit SQL as annotations
        working-directory: apps/api
        run: |
          gzip -9c prisma/migrations/0_init/migration.sql | base64 -w0 > sql.b64
          wc -c sql.b64
          split -b 3500 -d sql.b64 part_
          for f in part_*; do echo "::notice title=$f::$(cat $f)"; done
